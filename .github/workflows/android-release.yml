name: Android Native Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Generate Release & Debug Keystore
        run: |
          if [ ! -f "app/debug.keystore" ]; then
            keytool -genkey -v -keystore app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=VitreBook,O=OpenSource,C=US"
          fi

      - name: Generate App Launcher Icons
        run: |
          python3 -m pip install --upgrade pip pillow
          python3 -c "
          from PIL import Image
          import os

          logo_path = 'app/src/main/res/drawable/app_logo.jpg'
          if os.path.exists(logo_path):
              img = Image.open(logo_path).convert('RGBA')
              densities = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }
              for folder, size in densities.items():
                  target_dir = os.path.join('app/src/main/res', folder)
                  os.makedirs(target_dir, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
                  resized.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')
              print('Generated all launcher icon densities from crystal app logo.')
          "

      - name: Build Native Release APK with Gradle
        run: |
          gradle wrapper
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate and Package Release APK
        id: find_apk
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} build-output/ \;
          ls -la build-output/

          PRIMARY_APK=$(find build-output/ -name "*.apk" | head -n 1)
          echo "PRIMARY_APK=$PRIMARY_APK" >> $GITHUB_ENV
          echo "Found primary APK: $PRIMARY_APK"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitreBook-Native-Android-APK
          path: build-output/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
