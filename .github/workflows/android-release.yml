name: Android Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Fallback Release/Debug Keystore
        run: |
          if [ ! -f "android/app/debug.keystore" ]; then
            keytool -genkey -v -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=VitreBook,O=OpenSource,C=US"
          fi

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate and Package Built APKs
        id: find_apk
        run: |
          mkdir -p build-output
          # Look for arm64-v8a or universal APK
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} build-output/ \;
          ls -la build-output/

          # Export primary arm64 or universal apk
          PRIMARY_APK=$(find build-output/ -name "*arm64*.apk" | head -n 1)
          if [ -z "$PRIMARY_APK" ]; then
            PRIMARY_APK=$(find build-output/ -name "*universal*.apk" | head -n 1)
          fi
          if [ -z "$PRIMARY_APK" ]; then
            PRIMARY_APK=$(find build-output/ -name "*.apk" | head -n 1)
          fi
          echo "PRIMARY_APK=$PRIMARY_APK" >> $GITHUB_ENV
          echo "Found primary APK: $PRIMARY_APK"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitreBook-Android-APKs
          path: build-output/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
